<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Mellophi Fashion</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="js/config.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --panel: #ffffff;
            --text: #111111;
            --muted: #6a6a6a;
            --line: #dedede;
            --line-strong: #bcbcbc;
            --focus: #111111;
            --radius: 0;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            color: var(--text);
        }

        .cart-container {
            max-width: 1240px;
            margin: 92px auto 56px;
            padding: 0 22px;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 34px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--line);
        }

        .cart-title {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1.45rem, 2.2vw, 2rem);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            color: var(--text);
        }

        .cart-subtitle {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 0.83rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .checkout-steps {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .checkout-steps strong {
            font-weight: 600;
            color: var(--text);
        }

        .checkout-steps .muted-step {
            color: var(--muted);
        }

        .checkout-steps .step-divider {
            color: #b4b4b4;
            font-size: 0.68rem;
            letter-spacing: 0;
        }

        .cart-content {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(320px, 0.9fr);
            gap: 38px;
            align-items: start;
        }

        .cart-items,
        .order-summary {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: none;
        }

        .cart-items {
            padding: 22px;
        }

        .cart-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 13px;
            border-bottom: 1px solid var(--line);
        }

        .cart-panel-title {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            color: var(--text);
        }

        .btn-select-all {
            border: 1px solid var(--text);
            background: transparent;
            color: var(--text);
            border-radius: 0;
            padding: 8px 14px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-select-all:hover {
            background: var(--text);
            color: #fff;
        }

        .cart-item {
            display: grid;
            grid-template-columns: auto 88px 1fr auto;
            gap: 16px;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            margin: 0;
            transition: background-color 0.2s ease;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item.selected {
            background: #f8f8f8;
        }

        .item-checkbox {
            align-self: flex-start;
            padding-top: 2px;
        }

        .item-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #111;
            cursor: pointer;
        }

        .item-image {
            width: 88px;
            height: 112px;
            object-fit: cover;
            border-radius: 0;
            background: #f3f3f3;
            border: 1px solid #efefef;
        }

        .item-details {
            min-width: 0;
        }

        .item-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
            line-height: 1.25;
        }

        .item-meta {
            color: var(--muted);
            font-size: 0.76rem;
            margin-bottom: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item-price {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .quantity-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--line-strong);
            border-radius: 0;
            overflow: hidden;
            background: #fff;
        }

        .quantity-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: #fff;
            color: var(--text);
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .quantity-btn:hover {
            background: #f3f3f3;
        }

        .quantity-display {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 0 3px;
        }

        .btn-remove {
            padding: 7px 11px;
            background: transparent;
            border: 1px solid var(--line-strong);
            color: var(--text);
            border-radius: 0;
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            transition: background-color 0.2s ease;
        }

        .btn-remove:hover {
            background: #f3f3f3;
        }

        .item-subtotal {
            min-width: 108px;
            text-align: right;
            align-self: center;
        }

        .subtotal-label {
            color: var(--muted);
            font-size: 0.65rem;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .subtotal-amount {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
        }

        .order-summary {
            padding: 22px;
            position: sticky;
            top: 102px;
            height: fit-content;
        }

        .summary-title {
            margin: 0 0 18px;
            padding-bottom: 11px;
            border-bottom: 1px solid var(--line);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 1.1px;
            text-transform: uppercase;
            color: var(--text);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.79rem;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-row.selected-items {
            color: var(--muted);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--line);
        }

        .shipping-section {
            margin: 16px 0;
            padding: 13px 0;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .shipping-title {
            margin-bottom: 10px;
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .shipping-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 9px;
            border: 1px solid var(--line);
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            background: #fff;
            border-radius: 0;
        }

        .shipping-option:hover {
            border-color: var(--line-strong);
            background: #fafafa;
        }

        .shipping-option.selected {
            border-color: #111;
            background: #f7f7f7;
        }

        .shipping-option input[type="radio"] {
            width: 14px;
            height: 14px;
            accent-color: #111;
            cursor: pointer;
        }

        .shipping-info {
            flex: 1;
            margin-left: 8px;
        }

        .shipping-name {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .shipping-time {
            font-size: 0.69rem;
            color: var(--muted);
        }

        .shipping-cost {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text);
        }

        .total-section {
            background: #f8f8f8;
            border: 1px solid var(--line);
            padding: 13px;
            margin: 14px 0 16px;
            border-radius: 0;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text);
        }

        .total-amount {
            font-size: 1rem;
            color: var(--text);
        }

        .checkout-btn,
        .btn-complete {
            width: 100%;
            border-radius: 0;
            border: 1px solid #111;
            background: #111;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
            box-shadow: none;
        }

        .checkout-btn {
            padding: 13px;
            font-size: 0.74rem;
            margin-top: 2px;
        }

        .btn-complete {
            padding: 13px;
            font-size: 0.74rem;
            margin-top: 10px;
        }

        .checkout-btn:hover:not(:disabled),
        .btn-complete:hover {
            background: #fff;
            color: #111;
        }

        .checkout-btn:disabled {
            background: #d8d8d8;
            border-color: #d8d8d8;
            color: #fff;
            cursor: not-allowed;
        }

        .payment-section {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 0;
        }

        .payment-section.show {
            max-height: 2500px;
            opacity: 1;
            margin-top: 16px;
            overflow: visible;
        }

        .payment-form {
            border-top: 1px solid var(--line);
            padding-top: 16px;
            margin-top: 8px;
            background: transparent;
            border-radius: 0;
            border-left: 0;
            border-right: 0;
            border-bottom: 0;
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 0;
        }

        .form-title {
            margin: 0 0 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 0.67rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 10px;
            border: 1px solid var(--line);
            border-radius: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            background: #fff;
            color: var(--text);
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--focus);
            box-shadow: none;
        }

        #card-payment-fields {
            display: none;
        }

        #card-payment-fields.active {
            display: block;
        }

        .card-inline-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .payment-methods {
            display: grid;
            gap: 8px;
            margin-top: 6px;
        }

        .payment-method-option {
            cursor: pointer;
        }

        .payment-method-option input[type="radio"] {
            display: none;
        }

        .payment-method-card {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--line);
            border-radius: 0;
            padding: 10px;
            background: #fff;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .payment-method-option input[type="radio"]:checked + .payment-method-card {
            border-color: #111;
            background: #f7f7f7;
        }

        .payment-method-card:hover {
            border-color: var(--line-strong);
        }

        .payment-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #f4f4f4;
            border-radius: 0;
            font-size: 1rem;
        }

        .payment-name {
            color: var(--text);
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .payment-desc {
            color: var(--muted);
            font-size: 0.68rem;
        }

        /* Premium payment and summary overhaul */
        .order-items-mini {
            margin-bottom: 14px;
            max-height: 220px;
            overflow-y: auto;
            border-bottom: 1px solid var(--line);
            padding-bottom: 10px;
        }

        .order-mini-item {
            display: grid;
            grid-template-columns: 52px 1fr;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #f1f1f1;
        }

        .order-mini-item:last-child {
            border-bottom: none;
        }

        .order-mini-image {
            width: 52px;
            height: 68px;
            object-fit: cover;
            border: 1px solid #efefef;
            background: #f6f6f6;
        }

        .order-mini-name {
            font-size: 0.69rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .order-mini-meta {
            color: var(--muted);
            font-size: 0.64rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .order-mini-price {
            font-size: 0.68rem;
            font-weight: 600;
            margin-top: 4px;
        }

        .promo-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin: 10px 0 16px;
        }

        .promo-row input {
            border: 1px solid var(--line);
            border-radius: 0;
            padding: 10px 8px;
            font-size: 0.73rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .promo-row button {
            border: 1px solid #111;
            background: #fff;
            color: #111;
            padding: 0 10px;
            font-size: 0.66rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .promo-row button:hover {
            background: #111;
            color: #fff;
        }

        .summary-row.grand-total {
            font-size: 0.86rem;
            font-weight: 700;
            border-top: 1px solid var(--line);
            padding-top: 11px;
            margin-top: 7px;
            color: #111;
        }

        .payment-methods {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .payment-method-card {
            min-height: 72px;
            padding: 12px;
        }

        .payment-logos {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 3px;
        }

        .pay-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 18px;
            padding: 0 4px;
            border: 1px solid #d9d9d9;
            background: #fff;
            font-size: 0.54rem;
            font-weight: 700;
            letter-spacing: 0.35px;
            text-transform: uppercase;
            line-height: 1;
        }

        .pay-logo.visa { color: #1a1f71; }
        .pay-logo.mastercard { color: #eb001b; }
        .pay-logo.amex { color: #2e77bc; }
        .pay-logo.paypal { color: #003087; }
        .pay-logo.applepay { color: #111; }
        .pay-logo.googlepay { color: #1a73e8; }
        .pay-logo.eft { color: #008e3c; }

        .floating-group {
            position: relative;
            margin-bottom: 12px;
        }

        .input-shell {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b8b8b;
            font-size: 0.78rem;
            pointer-events: none;
        }

        .floating-input {
            width: 100%;
            border: 1px solid var(--line);
            padding: 14px 10px 6px 30px;
            font-size: 0.82rem;
            letter-spacing: 0.2px;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .floating-label {
            position: absolute;
            left: 30px;
            top: 11px;
            font-size: 0.7rem;
            color: #8b8b8b;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            transition: all 0.18s ease;
            pointer-events: none;
            background: transparent;
        }

        .floating-input:focus,
        .floating-input:not(:placeholder-shown) {
            border-color: #111;
            box-shadow: none;
        }

        .floating-input:focus + .floating-label,
        .floating-input:not(:placeholder-shown) + .floating-label {
            top: 2px;
            left: 30px;
            font-size: 0.58rem;
            color: #111;
        }

        .input-validation-success {
            border-color: #2ca44f !important;
            background: #f8fff9;
        }

        .input-validation-error {
            border-color: #da2f2f !important;
            background: #fff9f9;
        }

        .payment-dynamic-section {
            display: none;
            margin-top: 12px;
            border: 1px solid var(--line);
            padding: 12px;
            animation: slideDown 0.2s ease;
        }

        .payment-dynamic-section.active {
            display: block;
        }

        .card-preview {
            background: linear-gradient(135deg, #191919 0%, #2d2d2d 100%);
            color: #fff;
            padding: 14px;
            margin-bottom: 12px;
            min-height: 120px;
            display: grid;
            gap: 8px;
        }

        .card-preview-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .card-preview-number {
            font-size: 0.95rem;
            letter-spacing: 1.8px;
            font-weight: 600;
            margin-top: 8px;
        }

        .card-preview-bottom {
            display: flex;
            justify-content: space-between;
            align-items: end;
            margin-top: 6px;
            font-size: 0.66rem;
            text-transform: uppercase;
            color: #e0e0e0;
            letter-spacing: 0.5px;
        }

        .ssl-note {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.67rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #2ca44f;
            margin-top: 8px;
        }

        .btn-complete {
            background: linear-gradient(135deg, #0f0f0f 0%, #3a3a3a 55%, #0f0f0f 100%);
            border: 1px solid #0f0f0f;
            font-size: 0.71rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
        }

        .btn-complete .btn-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 999px;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-complete.loading .btn-spinner {
            display: inline-block;
        }

        .btn-complete.loading .btn-lock {
            display: none;
        }

        .btn-complete.loading {
            pointer-events: none;
            opacity: 0.9;
        }

        .payment-success-toast {
            position: fixed;
            right: 20px;
            top: 20px;
            z-index: 10001;
            background: #1e8e3e;
            color: #fff;
            border: 1px solid #1e8e3e;
            padding: 12px 14px;
            min-width: 260px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            animation: slideIn 0.22s ease;
        }

        .payment-success-toast .success-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.73rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .payment-success-toast .success-check {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .wallet-info,
        .eft-info {
            font-size: 0.69rem;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: var(--muted);
            line-height: 1.45;
        }

        .method-section-title {
            color: #111;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .method-section-note {
            color: var(--muted);
            font-size: 0.64rem;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .empty-cart {
            text-align: center;
            padding: 60px 18px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 0;
        }

        .empty-cart h2 {
            margin: 20px 0 10px;
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .empty-cart p {
            color: var(--muted);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-shop {
            display: inline-block;
            margin-top: 18px;
            border: 1px solid #111;
            border-radius: 0;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 11px 22px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .btn-shop:hover {
            background: #fff;
            color: #111;
        }

        .card-fields,
        .eft-details {
            animation: slideDown 0.25s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1100px) {
            .cart-content {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 860px) {
            .cart-item {
                grid-template-columns: auto 78px 1fr;
            }

            .item-image {
                width: 78px;
                height: 102px;
            }

            .item-subtotal {
                grid-column: 2 / span 2;
                text-align: left;
                margin-top: 4px;
            }
        }

        @media (max-width: 640px) {
            .cart-container {
                margin: 78px auto 40px;
                padding: 0 12px;
            }

            .cart-header {
                display: block;
                margin-bottom: 22px;
            }

            .checkout-steps {
                margin-top: 10px;
            }

            .cart-items,
            .order-summary {
                padding: 14px;
            }

            .cart-panel-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .cart-item {
                grid-template-columns: 1fr;
                gap: 9px;
                padding: 12px 0;
            }

            .item-checkbox,
            .item-subtotal {
                text-align: left;
            }

            .item-image {
                width: 100%;
                height: 230px;
            }

            .card-inline-grid {
                grid-template-columns: 1fr;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }

            .payment-success-toast {
                left: 12px;
                right: 12px;
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sticky-header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <h1><a href="index.html">MELLOPHI FASHION</a></h1>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-icons">
                    <button class="icon-btn" id="cart-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="badge" id="cart-count">0</span>
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <div class="cart-container">
        <div class="cart-header">
            <div>
                <h1 class="cart-title">Shopping Bag</h1>
                <p class="cart-subtitle">Review items and continue to secure payment</p>
            </div>
            <div class="checkout-steps">
                <strong>Bag</strong>
                <span class="step-divider">/</span>
                <span class="muted-step">Details</span>
                <span class="step-divider">/</span>
                <span class="muted-step">Payment</span>
            </div>
        </div>

        <div id="cart-content">
            <!-- Content will be loaded by JavaScript -->
        </div>
    </div>

    <script>
        cart = JSON.parse(localStorage.getItem('cart')) || [];
        let selectedShipping = 80;
        let selectedItems = new Set();
        let discountAmount = 0;
        let checkoutApiUrl = window.API_URL || 'http://localhost:5000/api';

        document.addEventListener('DOMContentLoaded', async function() {
            if (window.getApiUrl) {
                try {
                    checkoutApiUrl = await window.getApiUrl();
                } catch (error) {
                    console.warn('Using default API URL for checkout:', error);
                }
            }
            renderCart();
            updateCartCount();
        });

        function esc(value) {
            return String(value || '').replace(/[&<>"']/g, function(c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
        }

        function getItemImage(item) {
            const backendUrl = window.API_URL ? window.API_URL.replace('/api', '') : 'http://localhost:5000';
            let itemImage = item.image || (item.images && item.images[0]) || 'images/PRODUCTS/A1 front.png';
            if (!itemImage.startsWith('http') && !itemImage.startsWith('data:')) {
                itemImage = itemImage.startsWith('images/') ? `${backendUrl}/${itemImage}` : itemImage;
            }
            return itemImage;
        }

        function renderCart() {
            const content = document.getElementById('cart-content');
            if (!content) return;

            if (cart.length === 0) {
                content.innerHTML = `
                    <div class="empty-cart">
                        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#d4af7a" stroke-width="1.5">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <h2>Your cart is empty</h2>
                        <p>Start shopping to add items to your cart</p>
                        <a href="shop.html" class="btn-shop">Continue Shopping</a>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="cart-content">
                    <div class="cart-items" id="cart-items-list">
                        <div class="cart-panel-header">
                            <h3 class="cart-panel-title">Your Shopping Bag</h3>
                            <button class="btn-select-all" onclick="selectAllItems()">Select All Items</button>
                        </div>
                        ${cart.map((item, index) => createCartItemHTML(item, index)).join('')}
                    </div>

                    <div class="order-summary">
                        <h3 class="summary-title">Order Summary</h3>
                        <div id="summary-items"></div>
                        <div class="summary-row selected-items">
                            <span>Selected Items:</span>
                            <span id="selected-count">0 items</span>
                        </div>
                        <div class="summary-row"><span>Subtotal:</span><span id="subtotal-amount">R 0.00</span></div>
                        <div class="summary-row"><span>VAT (15% incl.):</span><span id="vat-amount">R 0.00</span></div>

                        <div class="shipping-section">
                            <div class="shipping-title">Shipping Options:</div>
                            <label class="shipping-option selected" onclick="selectShipping(80, this)">
                                <input type="radio" name="shipping" value="80" checked>
                                <div class="shipping-info"><div class="shipping-name">Standard Delivery</div><div class="shipping-time">3-5 business days</div></div>
                                <div class="shipping-cost">R 80.00</div>
                            </label>
                            <label class="shipping-option" onclick="selectShipping(150, this)">
                                <input type="radio" name="shipping" value="150">
                                <div class="shipping-info"><div class="shipping-name">Express Delivery</div><div class="shipping-time">1-2 business days</div></div>
                                <div class="shipping-cost">R 150.00</div>
                            </label>
                        </div>

                        <div class="summary-row"><span>Shipping:</span><span id="shipping-amount">R 80.00</span></div>
                        <div class="summary-row"><span>Discount:</span><span id="discount-amount">-R 0.00</span></div>

                        <div class="promo-row">
                            <input id="promo-code" type="text" placeholder="PROMO CODE">
                            <button type="button" id="apply-promo-btn">Apply</button>
                        </div>
                        <div id="promo-message" class="payment-desc"></div>

                        <div class="summary-row grand-total"><span>Grand Total:</span><span id="grand-total-amount">R 0.00</span></div>

                        <button class="checkout-btn" id="proceed-btn" onclick="showPaymentSection()" disabled>Continue to Payment</button>

                        <div class="payment-section" id="payment-section">
                            <div class="payment-form">
                                <h3 class="form-title">Secure Payment</h3>
                                <div class="ssl-note"><span>🔒</span><span>Secure SSL Payment</span></div>

                                <form id="payment-form" onsubmit="handleCheckout(event)">
                                    <div class="floating-group">
                                        <div class="input-shell">
                                            <span class="input-icon">👤</span>
                                            <input class="floating-input" id="name" type="text" placeholder=" " required>
                                            <label class="floating-label" for="name">Full Name *</label>
                                        </div>
                                    </div>

                                    <div class="floating-group">
                                        <div class="input-shell">
                                            <span class="input-icon">✉️</span>
                                            <input class="floating-input" id="email" type="email" placeholder=" " required>
                                            <label class="floating-label" for="email">Email Address *</label>
                                        </div>
                                    </div>

                                    <div class="floating-group">
                                        <div class="input-shell">
                                            <span class="input-icon">📞</span>
                                            <input class="floating-input" id="phone" type="tel" placeholder=" " required>
                                            <label class="floating-label" for="phone">Phone Number *</label>
                                        </div>
                                    </div>

                                    <div class="floating-group">
                                        <div class="input-shell">
                                            <span class="input-icon">📍</span>
                                            <input class="floating-input" id="address" type="text" placeholder=" " required>
                                            <label class="floating-label" for="address">Delivery Address *</label>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label>Payment Method</label>
                                        <div class="payment-methods">
                                            ${paymentMethodCard('visa', 'Visa', 'Pay securely with Visa', ['visa'])}
                                            ${paymentMethodCard('mastercard', 'Mastercard', 'Pay securely with Mastercard', ['mastercard'])}
                                            ${paymentMethodCard('amex', 'American Express', 'Pay with American Express', ['amex'])}
                                            ${paymentMethodCard('paypal', 'PayPal', 'Checkout with PayPal', ['paypal'])}
                                            ${paymentMethodCard('applepay', 'Apple Pay', 'Fast Apple wallet checkout', ['applepay'])}
                                            ${paymentMethodCard('googlepay', 'Google Pay', 'Fast Google wallet checkout', ['googlepay'])}
                                            ${paymentMethodCard('eft', 'Instant EFT', 'Instant bank transfer', ['eft'])}
                                        </div>
                                    </div>

                                    <div id="wallet-panel" class="payment-dynamic-section wallet-info">
                                        <div class="method-section-title" id="wallet-title">Wallet Details</div>
                                        <div class="method-section-note" id="wallet-note">Fill in your wallet details before secure redirect.</div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">👤</span>
                                                <input class="floating-input" id="wallet-account-name" type="text" placeholder=" ">
                                                <label class="floating-label" for="wallet-account-name">Wallet Account Name *</label>
                                            </div>
                                        </div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">✉️</span>
                                                <input class="floating-input" id="wallet-email" type="email" placeholder=" ">
                                                <label class="floating-label" for="wallet-email">Wallet Email *</label>
                                            </div>
                                        </div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">📞</span>
                                                <input class="floating-input" id="wallet-phone" type="tel" placeholder=" ">
                                                <label class="floating-label" for="wallet-phone">Wallet Phone *</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div id="eft-panel" class="payment-dynamic-section eft-info">
                                        <div class="method-section-title">Instant EFT Details</div>
                                        <div class="method-section-note">Provide your banking details exactly as used for payment.</div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">🏦</span>
                                                <input class="floating-input" id="eft-bank-name" type="text" placeholder=" ">
                                                <label class="floating-label" for="eft-bank-name">Bank Name *</label>
                                            </div>
                                        </div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">👤</span>
                                                <input class="floating-input" id="eft-account-holder" type="text" placeholder=" ">
                                                <label class="floating-label" for="eft-account-holder">Account Holder *</label>
                                            </div>
                                        </div>

                                        <div class="card-inline-grid">
                                            <div class="floating-group">
                                                <div class="input-shell">
                                                    <span class="input-icon">#</span>
                                                    <input class="floating-input" id="eft-account-number" type="text" inputmode="numeric" placeholder=" ">
                                                    <label class="floating-label" for="eft-account-number">Account Number *</label>
                                                </div>
                                            </div>

                                            <div class="floating-group">
                                                <div class="input-shell">
                                                    <span class="input-icon">#</span>
                                                    <input class="floating-input" id="eft-branch-code" type="text" inputmode="numeric" placeholder=" ">
                                                    <label class="floating-label" for="eft-branch-code">Branch Code *</label>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">🔖</span>
                                                <input class="floating-input" id="eft-reference" type="text" placeholder=" ">
                                                <label class="floating-label" for="eft-reference">Payment Reference *</label>
                                            </div>
                                        </div>
                                    </div>

                                    <div id="card-payment-fields" class="payment-dynamic-section">
                                        <div class="card-preview" id="live-card-preview">
                                            <div class="card-preview-top">
                                                <span>Secure Card</span>
                                                <span id="card-brand-preview">VISA</span>
                                            </div>
                                            <div class="card-preview-number" id="card-number-preview">#### #### #### ####</div>
                                            <div class="card-preview-bottom">
                                                <div>
                                                    <div>Cardholder</div>
                                                    <div id="card-name-preview">YOUR NAME</div>
                                                </div>
                                                <div>
                                                    <div>Expiry</div>
                                                    <div id="card-expiry-preview">MM/YY</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="payment-logos">
                                            <span class="pay-logo visa">Visa</span>
                                            <span class="pay-logo mastercard">Mastercard</span>
                                        </div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">👤</span>
                                                <input class="floating-input" id="cardholder-name" type="text" placeholder=" ">
                                                <label class="floating-label" for="cardholder-name">Cardholder Name *</label>
                                            </div>
                                        </div>

                                        <div class="floating-group">
                                            <div class="input-shell">
                                                <span class="input-icon">💳</span>
                                                <input class="floating-input" id="card-number" type="text" maxlength="19" inputmode="numeric" placeholder=" ">
                                                <label class="floating-label" for="card-number">Card Number *</label>
                                            </div>
                                        </div>

                                        <div class="card-inline-grid">
                                            <div class="floating-group">
                                                <div class="input-shell">
                                                    <span class="input-icon">📅</span>
                                                    <input class="floating-input" id="expiry-date" type="text" maxlength="5" inputmode="numeric" placeholder=" ">
                                                    <label class="floating-label" for="expiry-date">Expiry Date *</label>
                                                </div>
                                            </div>
                                            <div class="floating-group">
                                                <div class="input-shell">
                                                    <span class="input-icon">🔐</span>
                                                    <input class="floating-input" id="cvv" type="text" maxlength="4" inputmode="numeric" placeholder=" ">
                                                    <label class="floating-label" for="cvv">CVV *</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn-complete" id="submit-btn">
                                        <span class="btn-lock">🔒</span>
                                        <span>Complete Secure Payment</span>
                                        <span id="btn-total">R 0.00</span>
                                        <span class="btn-spinner"></span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            bindUIEvents();
            const defaultVisa = document.querySelector('input[name="payment-method"][value="visa"]');
            if (defaultVisa) {
                defaultVisa.checked = true;
            }
            selectAllItems();
            togglePaymentFields();
            updateSummary();
            updateCardPreview();
        }

        function paymentMethodCard(value, name, desc, logos) {
            const logosHtml = logos.map(l => `<span class="pay-logo ${l}">${l === 'mastercard' ? 'MC' : l.toUpperCase()}</span>`).join('');
            return `
                <label class="payment-method-option">
                    <input type="radio" name="payment-method" value="${value}" ${value === 'visa' ? 'checked' : ''} onchange="togglePaymentFields()">
                    <div class="payment-method-card">
                        <div class="payment-info">
                            <div class="payment-logos">${logosHtml}</div>
                            <div class="payment-name">${name}</div>
                            <div class="payment-desc">${desc}</div>
                        </div>
                    </div>
                </label>
            `;
        }

        function createCartItemHTML(item, index) {
            const itemPrice = parseFloat(item.price || 0);
            const itemTotal = (itemPrice * item.quantity).toFixed(2);
            const itemImage = getItemImage(item);

            return `
                <div class="cart-item" id="item-${index}">
                    <div class="item-checkbox">
                        <input type="checkbox" onchange="toggleItemSelection(${index})" id="checkbox-${index}">
                    </div>
                    <img src="${itemImage}" alt="${esc(item.name)}" class="item-image">
                    <div class="item-details">
                        <div class="item-name">${esc(item.name)}</div>
                        <div class="item-meta">Colour: ${esc(item.color || 'Default')} | Size: ${esc(item.size || 'N/A')}</div>
                        <div class="item-price">R ${itemPrice.toFixed(2)}</div>
                        <div class="item-controls">
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="decreaseQuantity(${index})" type="button">−</button>
                                <span class="quantity-display" id="qty-${index}">${item.quantity}</span>
                                <button class="quantity-btn" onclick="increaseQuantity(${index})" type="button">+</button>
                            </div>
                            <button class="btn-remove" onclick="removeItem(${index})" type="button">Remove</button>
                        </div>
                    </div>
                    <div class="item-subtotal">
                        <div class="subtotal-label">Subtotal</div>
                        <div class="subtotal-amount" id="subtotal-${index}">R ${itemTotal}</div>
                    </div>
                </div>
            `;
        }

        function bindUIEvents() {
            const promoBtn = document.getElementById('apply-promo-btn');
            if (promoBtn) promoBtn.addEventListener('click', applyPromoCode);

            const promoInput = document.getElementById('promo-code');
            if (promoInput) {
                promoInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        applyPromoCode();
                    }
                });
            }

            const cardNumber = document.getElementById('card-number');
            const expiry = document.getElementById('expiry-date');
            const cvv = document.getElementById('cvv');
            const name = document.getElementById('cardholder-name');

            if (cardNumber) {
                cardNumber.addEventListener('input', function(e) {
                    const onlyDigits = e.target.value.replace(/\D/g, '').slice(0, 19);
                    e.target.value = (onlyDigits.match(/.{1,4}/g) || []).join(' ');
                    updateCardPreview();
                    validateCardNumber(true);
                });
                cardNumber.addEventListener('blur', function() { validateCardNumber(false); });
            }

            if (expiry) {
                expiry.addEventListener('input', function(e) {
                    let v = e.target.value.replace(/\D/g, '').slice(0, 4);
                    if (v.length >= 3) v = v.slice(0, 2) + '/' + v.slice(2);
                    e.target.value = v;
                    updateCardPreview();
                    validateExpiry(true);
                });
                expiry.addEventListener('blur', function() { validateExpiry(false); });
            }

            if (cvv) {
                cvv.addEventListener('input', function(e) {
                    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
                    validateCVV(true);
                });
                cvv.addEventListener('blur', function() { validateCVV(false); });
            }

            if (name) {
                name.addEventListener('input', function(e) {
                    e.target.value = e.target.value.replace(/[^a-zA-Z\s]/g, '');
                    updateCardPreview();
                    validateCardholder(true);
                });
                name.addEventListener('blur', function() { validateCardholder(false); });
            }

            const walletName = document.getElementById('wallet-account-name');
            const walletEmail = document.getElementById('wallet-email');
            const walletPhone = document.getElementById('wallet-phone');

            if (walletName) {
                walletName.addEventListener('input', function() {
                    validateRequiredInput('wallet-account-name', { minLength: 2 });
                });
            }

            if (walletEmail) {
                walletEmail.addEventListener('input', function() {
                    validateRequiredInput('wallet-email', { type: 'email' });
                });
            }

            if (walletPhone) {
                walletPhone.addEventListener('input', function(e) {
                    e.target.value = e.target.value.replace(/[^\d+\s()-]/g, '');
                    validateRequiredInput('wallet-phone', { minLength: 7 });
                });
            }

            const eftBank = document.getElementById('eft-bank-name');
            const eftHolder = document.getElementById('eft-account-holder');
            const eftAcc = document.getElementById('eft-account-number');
            const eftBranch = document.getElementById('eft-branch-code');
            const eftRef = document.getElementById('eft-reference');

            if (eftBank) {
                eftBank.addEventListener('input', function() {
                    validateRequiredInput('eft-bank-name', { minLength: 2 });
                });
            }

            if (eftHolder) {
                eftHolder.addEventListener('input', function() {
                    validateRequiredInput('eft-account-holder', { minLength: 2 });
                });
            }

            if (eftAcc) {
                eftAcc.addEventListener('input', function(e) {
                    e.target.value = e.target.value.replace(/\D/g, '');
                    validateRequiredInput('eft-account-number', { numericMin: 6 });
                });
            }

            if (eftBranch) {
                eftBranch.addEventListener('input', function(e) {
                    e.target.value = e.target.value.replace(/\D/g, '');
                    validateRequiredInput('eft-branch-code', { numericMin: 4 });
                });
            }

            if (eftRef) {
                eftRef.addEventListener('input', function() {
                    validateRequiredInput('eft-reference', { minLength: 4 });
                });
            }

            document.querySelectorAll('.payment-method-card').forEach((cardEl) => {
                cardEl.addEventListener('click', function() {
                    const option = cardEl.closest('.payment-method-option');
                    const radio = option ? option.querySelector('input[name="payment-method"]') : null;
                    if (!radio) return;
                    radio.checked = true;
                    togglePaymentFields();
                });
            });
        }

        function applyValidationState(input, ok) {
            if (!input) return;
            input.classList.remove('input-validation-success', 'input-validation-error');
            if (ok === true) input.classList.add('input-validation-success');
            if (ok === false) input.classList.add('input-validation-error');
        }

        function setRequired(ids, required) {
            ids.forEach((id) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.required = required;
                if (!required) {
                    applyValidationState(el, null);
                }
            });
        }

        function validateRequiredInput(id, options = {}) {
            const el = document.getElementById(id);
            if (!el) return true;

            const value = (el.value || '').trim();
            let ok = !!value;

            if (ok && options.type === 'email') {
                ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
            }

            if (ok && options.numericMin) {
                ok = /^\d+$/.test(value) && value.length >= options.numericMin;
            }

            if (ok && options.minLength) {
                ok = value.length >= options.minLength;
            }

            applyValidationState(el, ok);
            return ok;
        }

        function validateMethodSpecificFields(selectedMethod) {
            const cardMethods = new Set(['visa', 'mastercard', 'amex']);
            const walletMethods = new Set(['paypal', 'applepay', 'googlepay']);

            if (cardMethods.has(selectedMethod)) {
                return validateCardholder(false) && validateCardNumber(false) && validateExpiry(false) && validateCVV(false);
            }

            if (walletMethods.has(selectedMethod)) {
                return [
                    validateRequiredInput('wallet-account-name', { minLength: 2 }),
                    validateRequiredInput('wallet-email', { type: 'email' }),
                    validateRequiredInput('wallet-phone', { minLength: 7 })
                ].every(Boolean);
            }

            if (selectedMethod === 'eft') {
                return [
                    validateRequiredInput('eft-bank-name', { minLength: 2 }),
                    validateRequiredInput('eft-account-holder', { minLength: 2 }),
                    validateRequiredInput('eft-account-number', { numericMin: 6 }),
                    validateRequiredInput('eft-branch-code', { numericMin: 4 }),
                    validateRequiredInput('eft-reference', { minLength: 4 })
                ].every(Boolean);
            }

            return true;
        }

        function luhnCheck(number) {
            let sum = 0;
            let shouldDouble = false;
            for (let i = number.length - 1; i >= 0; i--) {
                let digit = parseInt(number.charAt(i), 10);
                if (shouldDouble) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
                shouldDouble = !shouldDouble;
            }
            return sum % 10 === 0;
        }

        function validateCardNumber(isTyping) {
            const input = document.getElementById('card-number');
            if (!input) return true;
            const clean = input.value.replace(/\s/g, '');
            if (!clean) {
                applyValidationState(input, isTyping ? null : false);
                return false;
            }
            const ok = clean.length >= 13 && clean.length <= 19 && luhnCheck(clean);
            applyValidationState(input, ok);
            return ok;
        }

        function validateExpiry(isTyping) {
            const input = document.getElementById('expiry-date');
            if (!input) return true;
            const value = input.value.trim();
            if (!value) {
                applyValidationState(input, isTyping ? null : false);
                return false;
            }
            const m = /^(\d{2})\/(\d{2})$/.exec(value);
            if (!m) {
                applyValidationState(input, false);
                return false;
            }
            const month = Number(m[1]);
            const year = Number(m[2]);
            const now = new Date();
            const cy = now.getFullYear() % 100;
            const cm = now.getMonth() + 1;
            const ok = month >= 1 && month <= 12 && (year > cy || (year === cy && month >= cm));
            applyValidationState(input, ok);
            return ok;
        }

        function validateCVV(isTyping) {
            const input = document.getElementById('cvv');
            if (!input) return true;
            const ok = /^\d{3,4}$/.test(input.value.trim());
            if (!input.value.trim() && isTyping) {
                applyValidationState(input, null);
                return false;
            }
            applyValidationState(input, ok);
            return ok;
        }

        function validateCardholder(isTyping) {
            const input = document.getElementById('cardholder-name');
            if (!input) return true;
            const value = input.value.trim();
            const ok = value.length >= 2;
            if (!value && isTyping) {
                applyValidationState(input, null);
                return false;
            }
            applyValidationState(input, ok);
            return ok;
        }

        function updateCardPreview() {
            const number = document.getElementById('card-number')?.value || '';
            const name = document.getElementById('cardholder-name')?.value || '';
            const expiry = document.getElementById('expiry-date')?.value || '';
            const brand = document.querySelector('input[name="payment-method"]:checked')?.value || 'visa';

            const brandMap = {
                visa: 'VISA',
                mastercard: 'MASTERCARD',
                amex: 'AMEX'
            };

            const brandEl = document.getElementById('card-brand-preview');
            const numEl = document.getElementById('card-number-preview');
            const nameEl = document.getElementById('card-name-preview');
            const expiryEl = document.getElementById('card-expiry-preview');

            if (brandEl) brandEl.textContent = brandMap[brand] || 'CARD';
            if (numEl) numEl.textContent = number || '#### #### #### ####';
            if (nameEl) nameEl.textContent = name.trim() ? name.toUpperCase() : 'YOUR NAME';
            if (expiryEl) expiryEl.textContent = expiry || 'MM/YY';
        }

        function togglePaymentFields() {
            const selectedMethod = document.querySelector('input[name="payment-method"]:checked')?.value || 'visa';
            const cardSection = document.getElementById('card-payment-fields');
            const walletPanel = document.getElementById('wallet-panel');
            const eftPanel = document.getElementById('eft-panel');
            const walletTitle = document.getElementById('wallet-title');
            const walletNote = document.getElementById('wallet-note');
            const paymentSection = document.getElementById('payment-section');

            const cardMethods = new Set(['visa', 'mastercard', 'amex']);
            const walletMethods = new Set(['paypal', 'applepay', 'googlepay']);

            if (cardSection) cardSection.classList.toggle('active', cardMethods.has(selectedMethod));
            if (walletPanel) walletPanel.classList.toggle('active', walletMethods.has(selectedMethod));
            if (eftPanel) eftPanel.classList.toggle('active', selectedMethod === 'eft');

            if (paymentSection) {
                paymentSection.classList.add('show');
            }

            setRequired(['cardholder-name', 'card-number', 'expiry-date', 'cvv'], cardMethods.has(selectedMethod));
            setRequired(['wallet-account-name', 'wallet-email', 'wallet-phone'], walletMethods.has(selectedMethod));
            setRequired(['eft-bank-name', 'eft-account-holder', 'eft-account-number', 'eft-branch-code', 'eft-reference'], selectedMethod === 'eft');

            if (walletMethods.has(selectedMethod) && walletTitle && walletNote) {
                if (selectedMethod === 'paypal') {
                    walletTitle.textContent = 'PayPal Details';
                    walletNote.textContent = 'Use your PayPal account details exactly as registered.';
                } else if (selectedMethod === 'applepay') {
                    walletTitle.textContent = 'Apple Pay Details';
                    walletNote.textContent = 'Use the same contact details linked to your Apple Wallet.';
                } else {
                    walletTitle.textContent = 'Google Pay Details';
                    walletNote.textContent = 'Use the same contact details linked to your Google Wallet.';
                }
            }

            updateCardPreview();

            window.setTimeout(() => {
                const firstField = cardMethods.has(selectedMethod)
                    ? document.getElementById('cardholder-name')
                    : walletMethods.has(selectedMethod)
                        ? document.getElementById('wallet-account-name')
                        : selectedMethod === 'eft'
                            ? document.getElementById('eft-bank-name')
                            : null;

                if (firstField && typeof firstField.focus === 'function') {
                    firstField.focus({ preventScroll: true });
                }

                if (paymentSection) {
                    paymentSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }, 0);
        }

        function renderSummaryItems() {
            const host = document.getElementById('summary-items');
            if (!host) return;

            const selected = Array.from(selectedItems).filter(i => !!cart[i]);
            if (selected.length === 0) {
                host.innerHTML = '<div class="payment-desc">No selected items.</div>';
                return;
            }

            host.innerHTML = `
                <div class="order-items-mini">
                    ${selected.map(i => {
                        const it = cart[i];
                        const image = getItemImage(it);
                        const itemTotal = (parseFloat(it.price || 0) * it.quantity).toFixed(2);
                        return `
                            <div class="order-mini-item">
                                <img class="order-mini-image" src="${image}" alt="${esc(it.name)}">
                                <div>
                                    <div class="order-mini-name">${esc(it.name)}</div>
                                    <div class="order-mini-meta">Colour: ${esc(it.color || 'Default')}</div>
                                    <div class="order-mini-meta">Size: ${esc(it.size || 'N/A')}</div>
                                    <div class="order-mini-meta">Qty: ${it.quantity}</div>
                                    <div class="order-mini-price">R ${itemTotal}</div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function applyPromoCode() {
            const code = (document.getElementById('promo-code')?.value || '').trim().toUpperCase();
            const message = document.getElementById('promo-message');

            const subtotal = Array.from(selectedItems).reduce((sum, i) => {
                if (!cart[i]) return sum;
                return sum + parseFloat(cart[i].price || 0) * cart[i].quantity;
            }, 0);

            if (!code) {
                discountAmount = 0;
                if (message) message.textContent = '';
            } else if (code === 'WELCOME10') {
                discountAmount = subtotal * 0.1;
                if (message) {
                    message.textContent = 'Promo applied: 10% off';
                    message.style.color = '#2ca44f';
                }
            } else if (code === 'MELLO5') {
                discountAmount = subtotal * 0.05;
                if (message) {
                    message.textContent = 'Promo applied: 5% off';
                    message.style.color = '#2ca44f';
                }
            } else {
                discountAmount = 0;
                if (message) {
                    message.textContent = 'Invalid promo code';
                    message.style.color = '#da2f2f';
                }
            }

            updateSummary();
        }

        function selectAllItems() {
            cart.forEach((item, index) => {
                if (!item) return;
                const checkbox = document.getElementById(`checkbox-${index}`);
                const itemElement = document.getElementById(`item-${index}`);
                if (checkbox && !checkbox.checked) {
                    checkbox.checked = true;
                    selectedItems.add(index);
                }
                if (itemElement) itemElement.classList.add('selected');
            });
            updateSummary();
        }

        function toggleItemSelection(index) {
            const checkbox = document.getElementById(`checkbox-${index}`);
            const itemElement = document.getElementById(`item-${index}`);
            if (!checkbox || !itemElement) return;

            if (checkbox.checked) {
                selectedItems.add(index);
                itemElement.classList.add('selected');
            } else {
                selectedItems.delete(index);
                itemElement.classList.remove('selected');
            }
            updateSummary();
        }

        function increaseQuantity(index) {
            if (!cart[index]) return;
            cart[index].quantity++;
            updateItemDisplay(index);
            saveCart();
        }

        function decreaseQuantity(index) {
            if (!cart[index] || cart[index].quantity <= 1) return;
            cart[index].quantity--;
            updateItemDisplay(index);
            saveCart();
        }

        function updateItemDisplay(index) {
            const item = cart[index];
            if (!item) return;
            const itemTotal = (parseFloat(item.price || 0) * item.quantity).toFixed(2);
            const qty = document.getElementById(`qty-${index}`);
            const subtotal = document.getElementById(`subtotal-${index}`);
            if (qty) qty.textContent = item.quantity;
            if (subtotal) subtotal.textContent = `R ${itemTotal}`;
            updateSummary();
        }

        function removeItem(index) {
            if (!confirm('Remove this item from cart?')) return;
            selectedItems.delete(index);
            cart.splice(index, 1);
            saveCart();
            renderCart();
            updateCartCount();
        }

        function selectShipping(cost, element) {
            selectedShipping = cost;
            document.querySelectorAll('.shipping-option').forEach(opt => opt.classList.remove('selected'));
            if (element) element.classList.add('selected');
            updateSummary();
        }

        function updateSummary() {
            let subtotal = 0;
            let selectedCount = 0;

            selectedItems.forEach(index => {
                if (!cart[index]) return;
                subtotal += parseFloat(cart[index].price || 0) * cart[index].quantity;
                selectedCount++;
            });

            const vat = subtotal * 0.15;
            const total = subtotal + selectedShipping - discountAmount;

            const selectedCountEl = document.getElementById('selected-count');
            const subtotalEl = document.getElementById('subtotal-amount');
            const shippingEl = document.getElementById('shipping-amount');
            const vatEl = document.getElementById('vat-amount');
            const discountEl = document.getElementById('discount-amount');
            const grandTotalEl = document.getElementById('grand-total-amount');
            const btnTotal = document.getElementById('btn-total');
            const proceedBtn = document.getElementById('proceed-btn');

            if (selectedCountEl) selectedCountEl.textContent = `${selectedCount} item${selectedCount !== 1 ? 's' : ''}`;
            if (subtotalEl) subtotalEl.textContent = `R ${subtotal.toFixed(2)}`;
            if (shippingEl) shippingEl.textContent = selectedShipping === 0 ? 'FREE' : `R ${selectedShipping.toFixed(2)}`;
            if (vatEl) vatEl.textContent = `R ${vat.toFixed(2)}`;
            if (discountEl) {
                discountEl.textContent = `-R ${discountAmount.toFixed(2)}`;
                discountEl.style.color = discountAmount > 0 ? '#2ca44f' : '';
            }
            if (grandTotalEl) grandTotalEl.textContent = `R ${Math.max(total, 0).toFixed(2)}`;
            if (btnTotal) btnTotal.textContent = `R ${Math.max(total, 0).toFixed(2)}`;
            if (proceedBtn) proceedBtn.disabled = selectedCount === 0;

            renderSummaryItems();
        }

        function showPaymentSection() {
            const paymentSection = document.getElementById('payment-section');
            if (!paymentSection) return;
            paymentSection.classList.add('show');
            paymentSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function showSuccessToast() {
            const existing = document.querySelector('.payment-success-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'payment-success-toast';
            toast.innerHTML = '<div class="success-row"><span class="success-check">✓</span><span>Your order has been placed successfully.</span></div>';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4200);
        }

        async function handleCheckout(event) {
            event.preventDefault();

            const paymentMethodInput = document.querySelector('input[name="payment-method"]:checked');
            if (!paymentMethodInput) {
                alert('Please select a payment method');
                return;
            }
            const selectedMethod = paymentMethodInput.value;
            const cardMethods = new Set(['visa', 'mastercard', 'amex']);
            const walletMethods = new Set(['paypal', 'applepay', 'googlepay']);

            const selectedProducts = [];
            let subtotal = 0;
            selectedItems.forEach(index => {
                if (!cart[index]) return;
                selectedProducts.push({
                    productId: cart[index].id || cart[index].productId || 'UNKNOWN',
                    name: cart[index].name,
                    price: cart[index].price,
                    quantity: cart[index].quantity,
                    size: cart[index].size,
                    color: cart[index].color
                });
                subtotal += parseFloat(cart[index].price || 0) * cart[index].quantity;
            });

            if (selectedProducts.length === 0) {
                alert('Please select items to checkout.');
                return;
            }

            const methodValid = validateMethodSpecificFields(selectedMethod);
            if (!methodValid) {
                alert('Please complete all required fields for the selected payment method.');
                return;
            }

            const customerName = document.getElementById('name')?.value || '';
            const customerEmail = document.getElementById('email')?.value || '';
            const customerPhone = document.getElementById('phone')?.value || '';
            const shippingAddress = document.getElementById('address')?.value || '';
            const total = subtotal + selectedShipping - discountAmount;
            const orderReference = 'MELL' + Date.now();

            const submitBtn = document.getElementById('submit-btn');
            const originalHtml = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.classList.add('loading');
            }

            try {
                let gatewayMethod = 'payfast';
                if (cardMethods.has(selectedMethod)) {
                    gatewayMethod = 'card';
                } else if (selectedMethod === 'paypal') {
                    gatewayMethod = 'paypal';
                } else if (selectedMethod === 'applepay') {
                    gatewayMethod = 'applepay';
                } else if (selectedMethod === 'eft') {
                    gatewayMethod = 'eft';
                } else if (selectedMethod === 'googlepay') {
                    // Stored as payfast on backend; processed on hosted gateway.
                    gatewayMethod = 'payfast';
                }

                const response = await fetch(`${checkoutApiUrl}/paygate/initiate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: total,
                        reference: orderReference,
                        email: customerEmail,
                        firstName: customerName.split(' ')[0] || customerName,
                        lastName: customerName.split(' ').slice(1).join(' ') || customerName.split(' ')[0] || customerName,
                        paymentMethod: gatewayMethod,
                        orderDetails: {
                            items: selectedProducts,
                            shippingAddress: shippingAddress,
                            phone: customerPhone,
                            subtotal: subtotal,
                            shipping: selectedShipping,
                            discount: discountAmount
                        }
                    })
                });

                const result = await response.json();
                const paymentUrl = result.paymentUrl || (result.data && result.data.paymentUrl);

                if (result.success && paymentUrl) {
                    localStorage.setItem('pendingOrderItems', JSON.stringify(Array.from(selectedItems)));
                    window.location.href = paymentUrl;
                } else {
                    throw new Error(result.message || 'Failed to initiate payment');
                }
            } catch (error) {
                console.error('Error initiating payment:', error);
                alert('Error processing payment: ' + error.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('loading');
                    submitBtn.innerHTML = originalHtml;
                }
            }
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function updateCartCount() {
            const badge = document.getElementById('cart-count');
            if (!badge) return;
            const count = cart.reduce((sum, item) => sum + (item ? item.quantity : 0), 0);
            badge.textContent = count;
        }
    </script>
